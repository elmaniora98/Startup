{% extends 'base.html' %}

        <h1 class="text-9xl font-bold text-brand-700">404</h1>
        <h2 class="text-3xl font-semibold text-gray-800 mt-4 mb-2">Page non trouvée</h2>
        <p class="text-gray-600 mb-8 max-w-md mx-auto">

{% endblock %}
